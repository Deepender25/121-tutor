<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voice Tutor</title>
  <meta name="description" content="Talk one-to-one with your documents: tutor, explainer, researcher, brainstormer.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#f4f3ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d0d0f" media="(prefers-color-scheme: dark)">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
  <script>
    // Apply the saved theme before first paint (no flash).
    try { const t = localStorage.getItem("vt-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div id="app" aria-live="polite"></div>
  <div id="toasts" role="status"></div>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
